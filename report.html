<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report a Problem - Tunisia Reporter</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f5f7fb; color: #222; }
    .header { background: linear-gradient(135deg,#667eea,#764ba2); color: white; padding: 18px; text-align: center; }
    .header a { color: white; text-decoration: none; }
    .container { max-width: 1180px; margin: 24px auto; padding: 0 16px; }
    .report-form { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card { background: white; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,.08); overflow: hidden; }
    .map-container { height: 650px; }
    #reportMap { height: 100%; width: 100%; }
    .form-container { padding: 24px; }
    h2 { margin-bottom: 8px; }
    .sub { color: #666; margin-bottom: 18px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    textarea, input, select { width: 100%; border: 2px solid #e5e7eb; border-radius: 10px; padding: 12px; font-size: 15px; }
    textarea { min-height: 130px; resize: vertical; }
    .problem-types, .severity-levels { display: flex; flex-wrap: wrap; gap: 10px; }
    .problem-type, .severity-level { border: 2px solid #e5e7eb; padding: 10px 14px; border-radius: 12px; cursor: pointer; }
    .problem-type.selected, .severity-level.selected { background: #667eea; color: white; border-color: #667eea; }
    .location-info { background: #f8fafc; padding: 14px; border-radius: 12px; line-height: 1.7; }
    .submit-btn { width: 100%; border: none; border-radius: 12px; background: linear-gradient(135deg,#667eea,#764ba2); color: white; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .submit-btn:disabled { opacity: .7; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 14px; }
    @media (max-width: 900px) { .report-form { grid-template-columns: 1fr; } .map-container { height: 400px; } }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-size: 28px; font-weight: bold;"><i class="fas fa-map-marked-alt"></i> Tunisia Reporter 🇹🇳</div>
    <div style="margin-top: 8px;"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to map</a></div>
  </div>

  <div class="container">
    <div class="report-form">
      <div class="card map-container"><div id="reportMap"></div></div>
      <div class="card form-container">
        <h2>Report a Problem</h2>
        <p class="sub">Choose a type, click the map, write a description, then submit.</p>

        <form id="reportForm">
          <div class="form-group">
            <label>Problem Type</label>
            <div class="problem-types" id="problemTypes"></div>
            <input type="hidden" id="problemTypeId" name="problem_type_id">
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Describe the problem in detail..."></textarea>
          </div>

          <div class="form-group">
            <label>Severity</label>
            <div class="severity-levels">
              <div class="severity-level" data-severity="critical">Critical</div>
              <div class="severity-level" data-severity="high">High</div>
              <div class="severity-level" data-severity="medium">Medium</div>
              <div class="severity-level" data-severity="low">Low</div>
            </div>
            <input type="hidden" id="severity" name="severity">
          </div>

          <div class="form-group">
            <label>Location</label>
            <div class="location-info">
              <div><strong>Address:</strong> <span id="locationAddress">Click on the map to choose a location</span></div>
              <div><strong>Latitude:</strong> <span id="latitude">--</span></div>
              <div><strong>Longitude:</strong> <span id="longitude">--</span></div>
            </div>
          </div>

          <input type="hidden" id="latitudeInput" name="latitude">
          <input type="hidden" id="longitudeInput" name="longitude">
          <input type="hidden" id="addressInput" name="address">

          <button type="submit" class="submit-btn" id="submitBtn"><i class="fas fa-paper-plane"></i> Submit Report</button>
          <div class="status" id="formStatus">Ready.</div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE = './api/reports.php';
    const map = L.map('reportMap').setView([33.8869, 9.5375], 7);
    let marker = null;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function setStatus(message, isError = false) {
      const status = document.getElementById('formStatus');
      status.textContent = message;
      status.style.color = isError ? '#dc2626' : '#555';
    }

    async function loadProblemTypes() {
      const response = await fetch(`${API_BASE}?action=types`);
      const data = await response.json();
      if (!response.ok || !data.success) throw new Error(data.error || 'Failed to load problem types');

      const container = document.getElementById('problemTypes');
      container.innerHTML = '';
      data.data.forEach(type => {
        const div = document.createElement('div');
        div.className = 'problem-type';
        div.innerHTML = `${type.emoji} ${type.title}`;
        div.addEventListener('click', () => {
          document.querySelectorAll('.problem-type').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          document.getElementById('problemTypeId').value = type.id;
        });
        container.appendChild(div);
      });
    }

    document.querySelectorAll('.severity-level').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.severity-level').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('severity').value = el.dataset.severity;
      });
    });

    map.on('click', async e => {
      const { lat, lng } = e.latlng;
      document.getElementById('latitude').textContent = lat.toFixed(6);
      document.getElementById('longitude').textContent = lng.toFixed(6);
      document.getElementById('latitudeInput').value = lat;
      document.getElementById('longitudeInput').value = lng;

      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lng]).addTo(map);

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
        const data = await response.json();
        const address = data.display_name || 'Location selected';
        document.getElementById('locationAddress').textContent = address;
        document.getElementById('addressInput').value = address;
      } catch (error) {
        document.getElementById('locationAddress').textContent = 'Location selected';
        document.getElementById('addressInput').value = '';
      }
    });

    document.getElementById('reportForm').addEventListener('submit', async e => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      setStatus('Submitting report...');

      const payload = {
        problem_type_id: document.getElementById('problemTypeId').value,
        description: document.getElementById('description').value.trim(),
        severity: document.getElementById('severity').value,
        latitude: document.getElementById('latitudeInput').value,
        longitude: document.getElementById('longitudeInput').value,
        address: document.getElementById('addressInput').value,
        user_id: user ? user.id : null
      };

      if (!payload.problem_type_id || !payload.description || !payload.severity || !payload.latitude || !payload.longitude) {
        setStatus('Please fill all required fields and choose a location.', true);
        submitBtn.disabled = false;
        return;
      }

      try {
        const response = await fetch(`${API_BASE}?action=create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || 'Failed to submit report');
        }

        setStatus('Report submitted successfully. Redirecting...');
        setTimeout(() => { window.location.href = 'index.html'; }, 1000);
      } catch (error) {
        console.error(error);
        setStatus(error.message, true);
        if (error.message.includes('Authentication Error')) {
           setTimeout(() => {
             localStorage.removeItem('tr_user');
             window.location.href = 'login.html';
           }, 2000);
        }
      } finally {
        submitBtn.disabled = false;
      }
    });

    let user = null;

    function checkAuth() {
      const userStr = localStorage.getItem('tr_user');
      if (!userStr) {
        window.location.href = 'login.html';
        return false;
      }
      try {
        user = JSON.parse(userStr);
        if (!user || !user.id) {
          localStorage.removeItem('tr_user');
          window.location.href = 'login.html';
          return false;
        }
        return true;
      } catch (e) {
        localStorage.removeItem('tr_user');
        window.location.href = 'login.html';
        return false;
      }
    }

    async function init() {
      if (!checkAuth()) return;
      try {
        await loadProblemTypes();
        setStatus('Ready.');
      } catch (error) {
        setStatus(error.message, true);
      }
    }
    init();
  </script>
</body>
</html>
