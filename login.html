<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Tunisia Reporter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --clr-bg:      #0b0f1a;
      --clr-card:    #111827;
      --clr-border:  #1e2a40;
      --clr-primary: #4f8ef7;
      --clr-accent:  #c084fc;
      --clr-text:    #e2e8f0;
      --clr-muted:   #64748b;
      --clr-input:   #0f172a;
      --clr-error:   #f87171;
      --clr-success: #34d399;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--clr-bg);
      color: var(--clr-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background blobs */
    .bg-blobs {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: float 10s ease-in-out infinite alternate;
    }
    .blob-1 { width: 520px; height: 520px; background: var(--clr-primary); top: -140px; left: -140px; animation-duration: 11s; }
    .blob-2 { width: 400px; height: 400px; background: var(--clr-accent); bottom: -100px; right: -80px; animation-duration: 13s; animation-delay: -4s; }
    .blob-3 { width: 260px; height: 260px; background: #fb923c; top: 40%; left: 55%; animation-duration: 15s; animation-delay: -7s; }

    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }

    /* Grid pattern overlay */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* === Card === */
    .card-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
      margin: 24px;
      animation: slideUp .55s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-row {
      display: flex; align-items: center; gap: 12px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--clr-primary), var(--clr-accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; box-shadow: 0 8px 24px rgba(79,142,247,.35);
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 22px; font-weight: 800;
      background: linear-gradient(to right, var(--clr-primary), var(--clr-accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--clr-card);
      border: 1px solid var(--clr-border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04);
    }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px;
      background: var(--clr-input);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 600;
      border: none; border-radius: 9px;
      padding: 10px;
      cursor: pointer;
      background: transparent;
      color: var(--clr-muted);
      transition: all .25s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--clr-primary), var(--clr-accent));
      color: white;
      box-shadow: 0 4px 12px rgba(79,142,247,.3);
    }

    /* Form panels */
    .form-panel { display: none; }
    .form-panel.active { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .panel-title {
      font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700;
      margin-bottom: 4px;
    }
    .panel-sub { color: var(--clr-muted); font-size: 14px; margin-bottom: 24px; }

    /* Fields */
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--clr-muted); margin-bottom: 8px; letter-spacing: .04em;
      text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    .input-wrap i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--clr-muted); font-size: 15px; pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      background: var(--clr-input);
      border: 1.5px solid var(--clr-border);
      border-radius: 12px;
      color: var(--clr-text);
      font-family: 'DM Sans', sans-serif; font-size: 15px;
      padding: 13px 14px 13px 42px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap input:focus {
      border-color: var(--clr-primary);
      box-shadow: 0 0 0 3px rgba(79,142,247,.15);
    }
    .input-wrap input::placeholder { color: var(--clr-muted); opacity: .7; }

    /* Password toggle */
    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--clr-muted);
      cursor: pointer; font-size: 15px; padding: 0;
    }
    .toggle-pw:hover { color: var(--clr-text); }

    /* Submit button */
    .submit-btn {
      width: 100%; margin-top: 8px;
      font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700;
      border: none; border-radius: 12px;
      padding: 15px;
      background: linear-gradient(135deg, var(--clr-primary), var(--clr-accent));
      color: white;
      cursor: pointer;
      letter-spacing: .03em;
      box-shadow: 0 8px 24px rgba(79,142,247,.3);
      transition: opacity .2s, transform .15s, box-shadow .2s;
      position: relative; overflow: hidden;
    }
    .submit-btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(rgba(255,255,255,.12), transparent);
      pointer-events: none;
    }
    .submit-btn:hover:not(:disabled) { opacity: .92; transform: translateY(-1px); box-shadow: 0 12px 30px rgba(79,142,247,.4); }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

    /* Alert */
    .alert {
      display: none; border-radius: 10px;
      padding: 12px 14px; font-size: 14px;
      margin-top: 14px; align-items: center; gap: 10px;
    }
    .alert.show { display: flex; animation: fadeIn .3s ease; }
    .alert.error { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.3); color: var(--clr-error); }
    .alert.success { background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.3); color: var(--clr-success); }

    /* Divider */
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--clr-muted); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--clr-border); }

    /* Footer note */
    .foot-note { text-align: center; margin-top: 20px; font-size: 13px; color: var(--clr-muted); }
    .foot-note a { color: var(--clr-primary); text-decoration: none; }
    .foot-note a:hover { text-decoration: underline; }

    /* Password strength */
    .pw-strength { margin-top: 8px; }
    .pw-bars { display: flex; gap: 4px; margin-bottom: 4px; }
    .pw-bar { flex: 1; height: 3px; border-radius: 99px; background: var(--clr-border); transition: background .3s; }
    .pw-bar.active-1 { background: var(--clr-error); }
    .pw-bar.active-2 { background: #fb923c; }
    .pw-bar.active-3 { background: #facc15; }
    .pw-bar.active-4 { background: var(--clr-success); }
    .pw-label { font-size: 12px; color: var(--clr-muted); }

    /* Spinner */
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="bg-grid"></div>

<div class="card-wrap">

  <!-- Logo -->
  <div class="logo-row">
    <div class="logo-icon">🗺️</div>
    <span class="logo-text">Tunisia Reporter 🇹🇳</span>
  </div>

  <div class="card">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Register</button>
    </div>

    <!-- ===== LOGIN PANEL ===== -->
    <div class="form-panel active" id="panelLogin">
      <p class="panel-title">Welcome back 👋</p>
      <p class="panel-sub">Sign in to your account to continue.</p>

      <div class="field">
        <label>Email address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
          <button class="toggle-pw" onclick="togglePw('loginPassword', this)" tabindex="-1">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button class="submit-btn" id="loginBtn" onclick="handleLogin()">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>

      <div class="alert error" id="loginError"><i class="fas fa-circle-exclamation"></i> <span id="loginErrorMsg"></span></div>
      <div class="alert success" id="loginSuccess"><i class="fas fa-circle-check"></i> <span id="loginSuccessMsg"></span></div>

      <div class="divider">or</div>
      <div class="foot-note">Don't have an account? <a href="#" onclick="switchTab('register')">Register now</a></div>
    </div>

    <!-- ===== REGISTER PANEL ===== -->
    <div class="form-panel" id="panelRegister">
      <p class="panel-title">Create account ✨</p>
      <p class="panel-sub">Join Tunisia Reporter and help your community.</p>

      <div class="field">
        <label>Full Name</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" id="regName" placeholder="Aymen Ben Salah" autocomplete="name">
        </div>
      </div>

      <div class="field">
        <label>Username</label>
        <div class="input-wrap">
          <i class="fas fa-at"></i>
          <input type="text" id="regUsername" placeholder="aymen123" autocomplete="username">
        </div>
      </div>

      <div class="field">
        <label>Email address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="regPassword" placeholder="Min. 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)">
          <button class="toggle-pw" onclick="togglePw('regPassword', this)" tabindex="-1">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="pw-strength">
          <div class="pw-bars">
            <div class="pw-bar" id="bar1"></div>
            <div class="pw-bar" id="bar2"></div>
            <div class="pw-bar" id="bar3"></div>
            <div class="pw-bar" id="bar4"></div>
          </div>
          <span class="pw-label" id="pwLabel">Enter a password</span>
        </div>
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="regConfirm" placeholder="Repeat password" autocomplete="new-password">
          <button class="toggle-pw" onclick="togglePw('regConfirm', this)" tabindex="-1">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button class="submit-btn" id="registerBtn" onclick="handleRegister()">
        <i class="fas fa-user-plus"></i> Create Account
      </button>

      <div class="alert error" id="regError"><i class="fas fa-circle-exclamation"></i> <span id="regErrorMsg"></span></div>
      <div class="alert success" id="regSuccess"><i class="fas fa-circle-check"></i> <span id="regSuccessMsg"></span></div>

      <div class="divider">or</div>
      <div class="foot-note">Already have an account? <a href="#" onclick="switchTab('login')">Sign in</a></div>
    </div>

  </div><!-- /card -->
</div>

<script>
  /* ── Tab switching ── */
  function switchTab(tab) {
    document.getElementById('panelLogin').classList.toggle('active', tab === 'login');
    document.getElementById('panelRegister').classList.toggle('active', tab === 'register');
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    clearAlerts();
  }

  function clearAlerts() {
    ['loginError','loginSuccess','regError','regSuccess'].forEach(id => {
      document.getElementById(id).classList.remove('show');
    });
  }

  /* ── Password visibility toggle ── */
  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fas fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fas fa-eye';
    }
  }

  /* ── Password strength ── */
  function checkStrength(pw) {
    let score = 0;
    if (pw.length >= 8) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;

    const labels = ['','Weak','Fair','Good','Strong'];
    const colors = ['','active-1','active-2','active-3','active-4'];

    for (let i = 1; i <= 4; i++) {
      const bar = document.getElementById('bar' + i);
      bar.className = 'pw-bar' + (i <= score ? ' ' + colors[score] : '');
    }
    document.getElementById('pwLabel').textContent = pw.length === 0 ? 'Enter a password' : labels[score] || 'Weak';
  }

  /* ── Show alert ── */
  function showAlert(id, msgId, message) {
    document.getElementById(msgId).textContent = message;
    document.getElementById(id).classList.add('show');
  }

  /* ── Spinner helper ── */
  function setLoading(btnId, loading, defaultHTML) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading ? '<span class="spinner"></span> Please wait...' : defaultHTML;
  }

  /* ════════════ LOGIN ════════════ */
  async function handleLogin() {
    clearAlerts();
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) {
      showAlert('loginError', 'loginErrorMsg', 'Please fill in all fields.');
      return;
    }

    setLoading('loginBtn', true, '<i class="fas fa-sign-in-alt"></i> Sign In');

    try {
      const response = await fetch('./api/reports.php?action=login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await response.json();

      if (!response.ok || !data.success) throw new Error(data.error || 'Invalid credentials.');

      // Save user info to localStorage
      localStorage.setItem('tr_user', JSON.stringify({
        id:        data.data.id,
        username:  data.data.username,
        full_name: data.data.full_name,
        email:     data.data.email,
        role:      data.data.role
      }));

      showAlert('loginSuccess', 'loginSuccessMsg', `Welcome back, ${data.data.full_name || data.data.username}! Redirecting...`);
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);

    } catch (err) {
      showAlert('loginError', 'loginErrorMsg', err.message);
    } finally {
      setLoading('loginBtn', false, '<i class="fas fa-sign-in-alt"></i> Sign In');
    }
  }

  /* ════════════ REGISTER ════════════ */
  async function handleRegister() {
    clearAlerts();
    const full_name = document.getElementById('regName').value.trim();
    const username  = document.getElementById('regUsername').value.trim();
    const email     = document.getElementById('regEmail').value.trim();
    const password  = document.getElementById('regPassword').value;
    const confirm   = document.getElementById('regConfirm').value;

    if (!full_name || !username || !email || !password || !confirm) {
      showAlert('regError', 'regErrorMsg', 'Please fill in all fields.');
      return;
    }
    if (password.length < 8) {
      showAlert('regError', 'regErrorMsg', 'Password must be at least 8 characters.');
      return;
    }
    if (password !== confirm) {
      showAlert('regError', 'regErrorMsg', 'Passwords do not match.');
      return;
    }

    setLoading('registerBtn', true, '<i class="fas fa-user-plus"></i> Create Account');

    try {
      const response = await fetch('./api/reports.php?action=register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, username, email, password })
      });
      const data = await response.json();

      if (!response.ok || !data.success) throw new Error(data.error || 'Registration failed.');

      // Auto-login after register
      localStorage.setItem('tr_user', JSON.stringify({
        id:        data.data.id,
        username:  data.data.username,
        full_name: data.data.full_name,
        email:     data.data.email,
        role:      data.data.role
      }));

      showAlert('regSuccess', 'regSuccessMsg', 'Account created! Redirecting to the map...');
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);

    } catch (err) {
      showAlert('regError', 'regErrorMsg', err.message);
    } finally {
      setLoading('registerBtn', false, '<i class="fas fa-user-plus"></i> Create Account');
    }
  }

  /* ── Enter key support ── */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const activePanel = document.querySelector('.form-panel.active');
    if (activePanel.id === 'panelLogin') handleLogin();
    else handleRegister();
  });

  /* ── Redirect if already logged in ── */
  (function checkAuth() {
    const userStr = localStorage.getItem('tr_user');
    if (userStr) {
      try {
        const user = JSON.parse(userStr);
        if (user && user.id) {
          window.location.href = 'index.html';
        } else {
          localStorage.removeItem('tr_user');
        }
      } catch(_) {
        localStorage.removeItem('tr_user');
      }
    }
  })();
</script>
</body>
</html>
